global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "guardian-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]
    scrape_interval: 10s

  - job_name: "nats"
    metrics_path: /varz
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
